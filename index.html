<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Working Holiday Canada</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif', serif;
      font-size: 14px;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 60px 40px;
      line-height: 1.8;
    }

    main {
      max-width: 600px;
    }

    a {
      color: #0000EE;
      text-decoration: underline;
    }

    a:hover {
      color: #0000AA;
    }

    .header {
      margin-bottom: 40px;
    }

    .site-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .country {
      margin-top: 2px;
    }

    .location {
      margin-bottom: 36px;
    }

    .location a {
      display: inline-block;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
      line-height: 2.2;
    }

    .language {
      margin-top: 40px;
    }

    .language a {
      text-decoration: underline;
    }

    .language .current {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main>

    <header class="header">
      <h1 class="site-title">working holiday</h1>
      <div class="country">canada</div>
    </header>

    <nav>
      <ul class="menu">
        <li>
          <a href="/workingholiday/iec/">Canada</a>
        </li>
      </ul>
    </nav>

    <div class="language">
      <span class="current">EN</span>
      <span> | </span>
      <a href="#">KR</a>
    </div>

  </main>

  <script src="archive.js"></script>

</body>

</html>
