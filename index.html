<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Working Holiday Canada</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif', serif;
      font-size: 14px;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 60px 40px;
      line-height: 1.8;
    }

    main {
      max-width: 600px;
    }

    a {
      color: #0000EE;
      text-decoration: underline;
    }

    a:hover {
      color: #0000AA;
    }

    .header {
      margin-bottom: 40px;
    }

    .site-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
      line-height: 2.2;
    }

    .language {
      position: fixed;
      top: 24px;
      right: 40px;
      margin: 0;
    }
    
    .language a {
      text-decoration: underline;
    }
    
    .language .current {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main>

    <header class="header">
      <h1
        class="site-title"
        data-en="working holiday"
        data-ko="워킹홀리데이"
      >
        working holiday
      </h1>
    </header>

    <nav>
      <ul class="menu">
        <li>
          <a
            href="/workingholiday/iec/"
            data-en="Canada"
            data-ko="캐나다"
          >
            Canada
          </a>
        </li>
      </ul>
    </nav>

    <div class="language">
      <a href="#" id="lang-en">EN</a>
      <span> | </span>
      <a href="#" id="lang-ko">한국어</a>
    </div>

  </main>

  <script>

    // ----------------------------------------
    // Language
    // ----------------------------------------

    const LANGUAGE_KEY = "workingholiday_language";

    const currentLanguage =
      localStorage.getItem(LANGUAGE_KEY) || "en";


    // ----------------------------------------
    // Apply language
    // ----------------------------------------

    function applyLanguage(language) {

      document.documentElement.lang = language;

      document.querySelectorAll("[data-en][data-ko]").forEach(element => {

        element.textContent =
          element.dataset[language];

      });


      // Language selector

      const en = document.getElementById("lang-en");
      const ko = document.getElementById("lang-ko");

      if (language === "en") {

        en.classList.add("current");
        ko.classList.remove("current");

      } else {

        en.classList.remove("current");
        ko.classList.add("current");

      }


      // Page title

      document.title =
        language === "en"
          ? "Working Holiday Canada"
          : "캐나다 워킹홀리데이";
    }


    // ----------------------------------------
    // Language selector
    // ----------------------------------------

    document.getElementById("lang-en").addEventListener("click", event => {

      event.preventDefault();

      localStorage.setItem(LANGUAGE_KEY, "en");

      applyLanguage("en");

    });


    document.getElementById("lang-ko").addEventListener("click", event => {

      event.preventDefault();

      localStorage.setItem(LANGUAGE_KEY, "ko");

      applyLanguage("ko");

    });


    // ----------------------------------------
    // Run when page loads
    // ----------------------------------------

    applyLanguage(currentLanguage);

  </script>

</body>

</html>
