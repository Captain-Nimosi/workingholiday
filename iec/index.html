<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IEC Visa — Working Holiday Canada</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif', serif;
      font-size: 14px;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 60px 40px;
      line-height: 1.8;
    }

    main {
      max-width: 600px;
    }

    a {
      color: #0000EE;
      text-decoration: underline;
    }

    a:hover {
      color: #0000AA;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 32px 0;
    }

    h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 32px 0 8px 0;
    }

    p {
      margin: 0 0 16px 0;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .back {
      margin-top: 48px;
    }

    .back a {
      color: #111;
    }

    /* ---------- IEC steps ---------- */

    .steps {
      margin-top: 40px;
    }
    
    .step {
      margin: 0;
    }
    
    .step a {
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: #0000EE;
      text-decoration: underline;
    }
    
    .step a:hover {
      color: #0000AA;
    }
    
    .step-number {
      font-weight: 400;
      width: 18px;
      flex-shrink: 0;
    }
    
    .step-title {
      font-weight: 700;
    }
    
    .arrow {
      margin: 8px 0 8px 1px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <main>

    <h1>IEC Visa</h1>

    <p>
      International Experience Canada (IEC) is Canada's youth mobility
      program. The Working Holiday category allows eligible participants
      to apply for an open work permit.
    </p>

    <h2>Working Holiday</h2>

    <div class="steps">

      <div class="step">
        <a href="01-eligibility/">
          <span class="step-number">01</span>
          <span class="step-title">Eligibility</span>
        </a>
      </div>
    
      <div class="arrow">↓</div>
    
      <div class="step">
        <a href="02-application-process/">
          <span class="step-number">02</span>
          <span class="step-title">Application Process</span>
        </a>
      </div>
    
      <div class="arrow">↓</div>
    
      <div class="step">
        <a href="03-before-departure/">
          <span class="step-number">03</span>
          <span class="step-title">Before Departure</span>
        </a>
      </div>
    
    </div>

    <div class="back">
      <a href="../">back</a>
    </div>

  </main>

  <script src="../archive.js"></script>
  
</body>

</html>
